<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice Casio</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>


<body>
    <header>
        <h1>Reproduction d'une calculatrice Casio</h1>
    </header>

    <main>
            <div class="Tete">
                <div class="Marque">

                    <p>Casio</p>
                
                    <!-- Géneration d'un rectangle -->

                    <svg width="300" height="40" xmlns="http://www.w3.org/2000/svg">
                        <rect width="200" height="100" x="50" y="5" rx="0" ry="20" fill="gray" />
                    </svg>
                
                    <p>MS-80E</p>

                </div>
                <div class="Ecran">

                    <p>123456789</p>

                </div>
            </div>
            <div class ="Corp">
                <button class="off">OFF</button>
                <button class="plusetmoins">+/-</button>
                <button class="pourcent">%</button>
                <button>Local</button>
                <button>Euro</button>
                <button>MC</button>
                <button>MR</button>
                <button>M-</button>
                <button>M+</button>
                <button>÷</button>
                <button><i class="bi bi-play-fill"></i></button>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>X</button>
                <button>C</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>-</button>
                <button>AC</button>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>+</button>
                <button>0</button>
                <button>00</button>
                <button>.</button>
                <button>=</button>

            </div>
    </main>

    <footer>
        <p>Ceci est un projet Amateur pour la formation DWWM de l'Afpa</p>
    </footer>


</body>
</html>

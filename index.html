<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice Casio</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>


<body>
    <header>
        <h1>Reproduction d'une calculatrice Casio</h1>
    </header>

    <main>
            <div class="Tete">
                <div class="Marque">

                    <p>Casio</p>
                
                    <!-- Géneration d'un rectangle -->

                    <svg width="300" height="40" xmlns="http://www.w3.org/2000/svg">
                        <rect width="200" height="100" x="55" y="5" rx="0" ry="20" fill="gray" />
                    </svg>
                
                    <p>MS-80E</p>

                </div>
                <div class="Ecran">

                    <p>123456789</p>

                </div>
            </div>
            <div class ="Corp">
                <p class="set">SET</p>
                <p class="rate">RATE</p>
                    <div class="OFF">
                        <button>OFF</button>
                    </div>
                    <div class="plusetmoins">
                        <button>+/-</button>
                    </div>
                    <div class="pourcent">
                        <button>%</button>
                    </div>
                    <div class="Local">
                        <button>Local</button>
                    </div>
                    <div class="Euro">
                        <button>Euro</button>
                    </div>
                    <div class="MC">
                        <button>MC</button>
                    </div>
                    <div class="MR">
                        <button>MR</button>
                    </div>
                    <div class="Mmoins">
                        <button>M-</button>
                    </div>
                    <div class="Mplus">
                        <button>M+</button>
                    </div>
                    <div class="Division">
                        <button>÷</button>
                    </div>
                    <div class="Play">
                        <button><i class="bi bi-play-fill"></i></button>
                    </div>
                    <div class="Sept">
                        <button>7</button>
                    </div>
                    <div class="Huit">
                        <button>8</button>
                    </div>
                    <div class="Neuf">
                        <button>9</button>
                    </div>
                    <div class="Fois">
                        <button>X</button>
                    </div>
                    <div class="C">
                        <button>C</button>
                    </div>
                    <div class="Quatre">
                        <button>4</button>
                    </div>
                    <div class="Cinq">
                        <button>5</button>
                    </div>
                    <div class="Six">
                        <button>6</button>
                    </div>
                    <div class="Moins">
                        <button>-</button>
                    </div>
                    <div class="AC">
                        <button>AC</button>
                    </div>
                    <div class="Un">
                        <button>1</button>
                    </div>
                    <div class="Deux">
                        <button>2</button>
                    </div>
                    <div class="Trois">
                        <button>3</button>
                    </div>
                    <div class="plus">
                        <button>+</button>
                    </div>
                    <div class="Zero">
                        <button>0</button>
                    </div>
                    <div class="DoubleZero">
                        <button>00</button>
                    </div>
                    <div class="Point">
                        <button>.</button>
                    </div>
                    <div class="Egal">
                        <button>=</button>
                    </div>
                </div>
            </div>
    </main>

    <footer>
        <p>Ceci est un projet Amateur pour la formation DWWM de l'Afpa</p>
    </footer>


</body>
</html>
